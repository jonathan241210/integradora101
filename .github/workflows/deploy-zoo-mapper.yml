name: Desplegar Zoo Mapper (PWA) a GitHub Pages

on:
  push:
    branches:
      - main
      - victor
    paths:
      - 'tools/zoo-mapper/**'
      - '.github/workflows/deploy-zoo-mapper.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir contenido de zoo-mapper
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'tools/zoo-mapper'

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
