name: Verificaciones automatizadas
run-name: Verificaciones de ${{ github.ref_name }}

on:
  push:
    branches:
      - main
      - DevOps
  pull_request:
    branches:
      - main
      - DevOps

permissions:
  contents: read

jobs:
  api-unit:
    name: Pruebas unitarias de la API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar PHP 8.4 y Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Instalar dependencias de la API
        run: composer install --working-dir=apps/api/src --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Ejecutar pruebas unitarias de la API
        working-directory: apps/api/src
        run: vendor/bin/phpunit --testsuite=Unit

  mobile-tests:
    name: Pruebas de la aplicación móvil
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias del monorepo
        run: npm ci

      - name: Ejecutar pruebas de Mobile con cobertura
        run: npm run test:coverage --workspace=apps/mobile -- --runInBand
        env:
          CI: true

      - name: Guardar reporte de cobertura móvil
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage-report
          path: apps/mobile/coverage/
          if-no-files-found: ignore

  dashboard-build:
    name: Build y artefacto del Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias del monorepo
        run: npm ci

      - name: Compilar Dashboard
        run: npm run build --workspace=@arca/dashboard

      - name: Comprobar salida
        run: test -f apps/dashboard/dist/index.html

      - name: Crear ZIP de distribución
        run: zip -r dashboard-dist.zip apps/dashboard/dist

      - name: Comprobar ZIP
        run: |
          unzip -t dashboard-dist.zip
          unzip -Z1 dashboard-dist.zip | grep -Fx 'apps/dashboard/dist/index.html'

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-build
          path: dashboard-dist.zip

  dashboard-types:
    name: Verificación de tipos del Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias del monorepo
        run: npm ci

      - name: Verificar tipos del Dashboard
        run: npm run types --workspace=@arca/dashboard

  dashboard-tests:
    name: Pruebas del Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias del monorepo
        run: npm ci

      - name: Ejecutar pruebas del Dashboard
        run: npm run test --workspace=@arca/dashboard
        env:
          CI: true

  pwa-tests:
    name: Pruebas de la PWA veterinaria
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias del monorepo
        run: npm ci

      - name: Ejecutar pruebas de la PWA
        run: npm run test --workspace=apps/pwa
        env:
          CI: true

  pwa-build:
    name: Build de la PWA veterinaria
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias del monorepo
        run: npm ci

      - name: Compilar PWA
        run: npm run build --workspace=apps/pwa

      - name: Comprobar salida de PWA
        run: test -f apps/pwa/dist/index.html
